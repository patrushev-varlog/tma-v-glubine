let anim=Object.keys(A)[0],dir="south-east",speed=1,playing=true,k=0,timer=null,imgs=[];
const cache={};const load=s=>cache[s]||(cache[s]=new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=s;}));
function bottom(img){const c=document.createElement("canvas");c.width=img.width;c.height=img.height;const x=c.getContext("2d");x.drawImage(img,0,0);const d=x.getImageData(0,0,c.width,c.height).data;for(let y=c.height-1;y>=0;y--)for(let X=0;X<c.width;X++)if(d[(y*c.width+X)*4+3]>0)return y;return c.height-1;}
function draw(cv,img){const x=cv.getContext("2d");x.imageSmoothingEnabled=false;x.clearRect(0,0,cv.width,cv.height);x.drawImage(img,Math.round((cv.width-img.width)/2),cv.height-8-img._b);}
function seg(id,opts,cur,set,name){const el=document.getElementById(id);el.innerHTML="";for(const o of opts){const b=document.createElement("button");b.textContent=name?name(o):o;b.className=o===cur?"on":"";b.onclick=()=>set(o);el.appendChild(b);}}
async function setup(){clearTimeout(timer);if(!A[anim][dir])dir=Object.keys(A[anim])[0];
 seg("anim",Object.keys(A),anim,v=>{anim=v;setup();});seg("dir",Object.keys(A[anim]),dir,v=>{dir=v;setup();},v=>DN[v]||v);
 const a=A[anim][dir];imgs=await Promise.all(a.frames.map(load));imgs.forEach(i=>i._b=i._b??bottom(i));

 k=0;tick();}
function show(){draw(document.getElementById("cv"),imgs[k]);[...document.getElementById("strip").children].forEach((c,i)=>c.className=i===k?"cur":"");}
function tick(){show();if(!playing)return;const d=A[anim][dir].dur[k]/speed;timer=setTimeout(()=>{k=(k+1)%imgs.length;tick();},d);}
