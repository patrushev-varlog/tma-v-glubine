function bbox(img){const c=document.createElement("canvas");c.width=img.width;c.height=img.height;const x=c.getContext("2d");x.drawImage(img,0,0);const d=x.getImageData(0,0,c.width,c.height).data;let x0=1e9,y0=1e9,x1=-1,y1=-1;for(let y=0;y<c.height;y++)for(let X=0;X<c.width;X++)if(d[(y*c.width+X)*4+3]>0){x0=Math.min(x0,X);y0=Math.min(y0,y);x1=Math.max(x1,X);y1=Math.max(y1,y);}return{x0,y0,x1,y1};}

async function scene(D){const cv=document.getElementById("scene"),ctx=cv.getContext("2d");ctx.clearRect(0,0,cv.width,cv.height);ctx.imageSmoothingEnabled=false;

 for(const[x,y]of cells){const edge=(x===N-1||y===N-1)&&D.tiles.edge;const src=edge?D.tiles.edge:floors[(x*7+y*3)%floors.length];const im=await load(src),b=bbox(im);const[px,py]=pos(x,y);ctx.drawImage(im,px+32-Math.round((b.x0+b.x1+1)/2),py-b.y0);}

function anim(frames,label){const d=document.createElement("div");d.className="cell";const cv=document.createElement("canvas");d.appendChild(cv);d.append(label);let k=0;
 Promise.all(frames.map(load)).then(ims=>{cv.width=ims[0].width;cv.height=ims[0].height;cv.style.width=ims[0].width*3+"px";const x=cv.getContext("2d");const tick=()=>{x.clearRect(0,0,cv.width,cv.height);x.drawImage(ims[k%ims.length],0,0);k++;};tick();timers.push(setInterval(tick,120));});return d;}

 document.getElementById("ver").innerHTML="";for(const v of Object.keys(SETS)){const b=document.createElement("button");b.textContent=v;b.className=v===ver?"on":"";b.onclick=()=>{ver=v;render();};document.getElementById("ver").appendChild(b);}
