; Пресеты экспорта среза. Сборки кладутся в build/ в корне репозитория (в .gitignore).
; Steam (Windows, macOS, Linux/Steam Deck) и Android — полигон.

[preset.0]

name="macOS"
platform="macOS"
runnable=true
export_filter="all_resources"
include_filter="story/*.json"
exclude_filter="tests/*, tools/*"
export_path="../../build/stack-slice/macos/TmaStackSlice.zip"

[preset.0.options]

binary_format/architecture="universal"
application/bundle_identifier="com.patrushev.tmavglubine.slice"
application/short_version="0.1"
application/version="0.1"
codesign/codesign=1
notarization/notarization=0

[preset.1]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="story/*.json"
exclude_filter="tests/*, tools/*"
export_path="../../build/stack-slice/windows/TmaStackSlice.exe"

[preset.1.options]

binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=false

[preset.2]

name="Linux"
platform="Linux"
runnable=true
export_filter="all_resources"
include_filter="story/*.json"
exclude_filter="tests/*, tools/*"
export_path="../../build/stack-slice/linux/TmaStackSlice.x86_64"

[preset.2.options]

binary_format/architecture="x86_64"

[preset.3]

name="Android"
platform="Android"
runnable=true
export_filter="all_resources"
include_filter="story/*.json"
exclude_filter="tests/*, tools/*"
export_path="../../build/stack-slice/android/TmaStackSlice.apk"

[preset.3.options]

gradle_build/use_gradle_build=false
architectures/arm64-v8a=true
architectures/armeabi-v7a=false
architectures/x86=false
architectures/x86_64=false
package/unique_name="com.patrushev.tmavglubine.slice"
package/name="Тьма: срез"
screen/immersive_mode=true
