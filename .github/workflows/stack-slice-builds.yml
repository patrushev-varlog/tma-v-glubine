# Срез стека: сборки под macOS, Windows, Linux и Android. Каждая сборка (кроме Android)
# запускается с --selftest на своей системе и выкладывается артефактом на 14 дней.
# Минуты macOS в приватном репозитории идут с коэффициентом 10, поэтому только по изменениям среза.
# Linux собирается на своём раннере (VPS, self-hosted); macOS, Windows и Android — на раннерах GitHub
# (Android требует SDK, которого на VPS нет).
name: stack-slice-builds

on:
  pull_request:
    paths:
      - "prototypes/stack-slice/**"
      - ".github/workflows/stack-slice-builds.yml"
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  SLICE: prototypes/stack-slice

jobs:
  export:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            preset: macOS
            key: macos
            godot: Godot_v4.7.2-stable_mono_macos.universal.zip
            out: build/stack-slice/macos
          - os: windows-2022
            preset: Windows Desktop
            key: windows
            godot: Godot_v4.7.2-stable_mono_win64.zip
            out: build/stack-slice/windows
          - os: self-hosted
            preset: Linux
            key: linux
            godot: Godot_v4.7.2-stable_mono_linux_x86_64.zip
            out: build/stack-slice/linux
          - os: ubuntu-24.04
            preset: Android
            key: android
            godot: Godot_v4.7.2-stable_mono_linux_x86_64.zip
            out: build/stack-slice/android
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # 8 — для ПК; Android-шаблон Godot 4.7 собран под .NET 9.
          dotnet-version: |
            8.0.x
            9.0.x
      - uses: actions/setup-java@v4
        if: matrix.preset == 'Android'
        with:
          distribution: temurin
          java-version: "17"
      - name: Godot и шаблоны экспорта
        shell: bash
        run: |
          B=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSL -o godot.zip $B/${{ matrix.godot }}
          curl -sSL -o tpl.tpz $B/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz
          mkdir -p ~/godot && unzip -qo godot.zip -d ~/godot
          case "${{ runner.os }}" in
            macOS)   T="$HOME/Library/Application Support/Godot/export_templates"
                     G="$HOME/godot/Godot_mono.app/Contents/MacOS/Godot";;
            Windows) T="$APPDATA/Godot/export_templates"
                     G="$(ls $HOME/godot/*/Godot_v${GODOT_VERSION}-stable_mono_win64_console.exe)";;
            *)       T="$HOME/.local/share/godot/export_templates"
                     G="$HOME/godot/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64";;
          esac
          mkdir -p "$T/${GODOT_VERSION}.stable.mono"
          unzip -qo tpl.tpz -d tpl && mv -f tpl/templates/* "$T/${GODOT_VERSION}.stable.mono/"
          rm -rf tpl tpl.tpz godot.zip
          echo "GODOT=$G" >> $GITHUB_ENV
      - name: Настройки Android (SDK раннера, отладочный ключ)
        if: matrix.preset == 'Android'
        shell: bash
        run: |
          keytool -genkeypair -keystore $HOME/debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/debug.keystore" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> $GITHUB_ENV
          # Пути SDK и JDK — в настройках редактора: создаём их запуском и дописываем.
          "$GODOT" --headless --quit || true
          S=$(ls $HOME/.config/godot/editor_settings-4.*.tres | head -1)
          sed -i '/^export\/android\/\(android_sdk_path\|java_sdk_path\)/d' "$S"
          echo "export/android/android_sdk_path = \"$ANDROID_SDK_ROOT\"" >> "$S"
          echo "export/android/java_sdk_path = \"$JAVA_HOME\"" >> "$S"
      - name: Экспорт ${{ matrix.preset }}
        shell: bash
        working-directory: ${{ env.SLICE }}
        run: |
          mkdir -p ../../${{ matrix.out }}
          "$GODOT" --headless --path . --import || true
          if [ "${{ matrix.preset }}" = "Android" ]; then
            "$GODOT" --headless --path . --export-debug Android ../../${{ matrix.out }}/TmaStackSlice.apk
          else
            "$GODOT" --headless --path . --export-release "${{ matrix.preset }}"
          fi
          ls -la ../../${{ matrix.out }}
      - name: Самопроверка сборки (вся история через рантайм внутри сборки)
        if: matrix.preset != 'Android'
        shell: bash
        working-directory: ${{ matrix.out }}
        run: |
          case "${{ matrix.preset }}" in
            macOS)
              unzip -q TmaStackSlice.zip
              APP=$(ls -d *.app)
              "$APP/Contents/MacOS/$(ls "$APP/Contents/MacOS")" --headless -- --selftest;;
            "Windows Desktop")
              pwsh -Command '$p = Start-Process -FilePath .\TmaStackSlice.exe -ArgumentList "--headless","--","--selftest" -Wait -PassThru -RedirectStandardOutput out.txt; Get-Content out.txt; exit $p.ExitCode';;
            *)
              ./TmaStackSlice.x86_64 --headless -- --selftest;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: stack-slice-${{ matrix.key }}
          path: |
            ${{ matrix.out }}/*.zip
            ${{ matrix.out }}/*.exe
            ${{ matrix.out }}/*.pck
            ${{ matrix.out }}/*.apk
            ${{ matrix.out }}/*.x86_64
            ${{ matrix.out }}/data_*
          retention-days: 14
