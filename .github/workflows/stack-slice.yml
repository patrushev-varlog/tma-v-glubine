# Срез стека: тесты Ink (GodotInk и запасной inkgd против inkjs на текущей истории), английский текст, геймпад.
# Сборки под платформы — в stack-slice-builds.yml.
# Идёт на своём раннере (VPS, self-hosted), минуты GitHub не тратятся.
name: stack-slice

on:
  pull_request:
    paths:
      - "prototypes/stack-slice/**"
      - "story/**"
      - ".github/workflows/stack-slice.yml"
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  SLICE: prototypes/stack-slice

jobs:
  tests:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Ink — сцена свежая, русский и английский совпадают; история и эталон пересобраны
        working-directory: ${{ env.SLICE }}/tools
        run: |
          npm install --no-audit --no-fund
          node ink_tool.mjs check
          # Сюжет правят другие треды: тесты рантаймов идут на текущей истории, а не на снимке.
          node ink_tool.mjs build
          node ink_tool.mjs reference
      - name: Godot
        run: |
          B=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSL -o mono.zip $B/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip
          curl -sSL -o std.zip $B/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -qo mono.zip -d ~/godot && unzip -qo std.zip -d ~/godot
          echo "GODOT_MONO=$HOME/godot/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64" >> $GITHUB_ENV
          echo "GODOT_STD=$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> $GITHUB_ENV
      - name: Тесты среза (GodotInk против inkjs, смена языка, геймпад)
        working-directory: ${{ env.SLICE }}
        run: |
          dotnet build StackSlice.csproj -v q
          $GODOT_MONO --headless --path . --import || true
          $GODOT_MONO --headless --path . -s res://tests/run_tests.gd
      - name: Запасной рантайм inkgd против inkjs
        working-directory: ${{ env.SLICE }}/fallback-inkgd
        run: |
          $GODOT_STD --headless --path . --import || true
          SLICE_RUNS=4 $GODOT_STD --headless --path . -s res://tests/run_tests.gd
