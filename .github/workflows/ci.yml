name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  # Проект игры (Godot .NET): тесты, самопроверка и сборки под Windows, macOS и Linux.
  GAME_DIR: game

jobs:
  prototype-tests:
    name: Тесты прототипа боя
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Установить Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
      - name: Импорт проекта
        run: godot --headless --path prototypes/combat --import
      - name: Правила боя
        run: godot --headless --path prototypes/combat -s res://tests/run_tests.gd
      - name: Бой через интерфейс
        run: godot --headless --path prototypes/combat -s res://tests/ui_smoke.gd

  ink:
    name: Компиляция Ink
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Скомпилировать story/ink/game.ink
        run: npx -y -p inkjs@2.4.0 inkjs-compiler story/ink/game.ink -o "$RUNNER_TEMP/game.json"

  game-tests:
    name: Игра — тесты и самопроверка
    runs-on: ubuntu-24.04
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: История — JSON из текущего story/ink
        working-directory: ${{ env.GAME_DIR }}/tools
        run: |
          npm ci --no-audit --no-fund
          # Сюжет правят другие треды: устаревший JSON — предупреждение, тесты идут на свежей сборке.
          node ink_tool.mjs check || echo "::warning::game/story/*.json устарел — запустите node game/tools/ink_tool.mjs build"
          node ink_tool.mjs build
      - name: Godot .NET
        run: |
          B=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSL -o mono.zip $B/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip
          unzip -q mono.zip -d ~/godot && rm mono.zip
          echo "GODOT=$HOME/godot/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64" >> $GITHUB_ENV
      - name: Тесты GUT (бой, сюжет, сохранения)
        working-directory: ${{ env.GAME_DIR }}
        run: |
          dotnet build TmaGame.csproj -v q
          $GODOT --headless --path . --import || true
          $GODOT --headless --path . -s addons/gut/gut_cmdln.gd
      - name: Самопроверка в редакторе
        working-directory: ${{ env.GAME_DIR }}
        run: $GODOT --headless --path . -- --selftest

  export:
    name: Сборка ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: Windows Desktop
            key: windows
          - preset: macOS
            key: macos
          - preset: Linux
            key: linux
          # Демо для плейтеста и Steam (пролог): Windows и macOS — для тестеров, Linux — для самопроверки.
          - preset: Windows Desktop Demo
            key: windows-demo
          - preset: macOS Demo
            key: macos-demo
          - preset: Linux Demo
            key: linux-demo
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: История из текущего story/ink
        working-directory: ${{ env.GAME_DIR }}/tools
        run: |
          npm ci --no-audit --no-fund
          node ink_tool.mjs build
      - name: Godot .NET и шаблоны экспорта
        run: |
          B=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSL -o mono.zip $B/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip
          curl -sSL -o tpl.tpz $B/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz
          unzip -q mono.zip -d ~/godot
          T="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono"
          mkdir -p "$T" && unzip -q tpl.tpz -d tpl && mv tpl/templates/* "$T/"
          rm -rf tpl tpl.tpz mono.zip
          echo "GODOT=$HOME/godot/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64" >> $GITHUB_ENV
      # Все сборки делаются на Linux: экспорт .NET-проекта под Windows и macOS (universal) работает и отсюда.
      - name: Экспорт
        working-directory: ${{ env.GAME_DIR }}
        run: |
          mkdir -p ../build/game/${{ matrix.key }}
          $GODOT --headless --path . --import || true
          $GODOT --headless --path . --export-release "${{ matrix.preset }}"
          ls -la ../build/game/${{ matrix.key }}
      - name: Самопроверка сборки Linux
        if: matrix.key == 'linux' || matrix.key == 'linux-demo'
        working-directory: build/game/${{ matrix.key }}
        run: ./TmaVGlubine.x86_64 --headless -- --selftest
      - uses: actions/upload-artifact@v4
        with:
          name: game-${{ matrix.key }}
          path: build/game/${{ matrix.key }}/
          retention-days: 14

  # Сборка Windows запускается на Windows на каждом PR.
  smoke:
    name: Запуск сборки windows
    needs: export
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: game-windows
          path: build
      - name: Самопроверка
        shell: pwsh
        working-directory: build
        run: |
          $p = Start-Process -FilePath .\TmaVGlubine.exe -ArgumentList "--headless","--","--selftest" -Wait -PassThru -RedirectStandardOutput out.txt
          Get-Content out.txt
          exit $p.ExitCode

  # Подпись, которую ставит Godot при экспорте с Linux, новые macOS на Apple Silicon не принимают: программу убивают
  # при запуске («killed»). Поэтому сборки macOS переподписываются родным codesign (ad-hoc, без Apple ID),
  # проверяются самопроверкой и заменяют артефакты. Минуты macOS в приватном репозитории идут с коэффициентом 10,
  # поэтому это только после слияния в main и по кнопке: рабочие сборки для Mac — из прогонов main.
  macos:
    name: Подпись и запуск ${{ matrix.key }}
    needs: export
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        key: [macos, macos-demo]
    runs-on: macos-14
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: game-${{ matrix.key }}
          path: build
      - name: Переподпись
        working-directory: build
        run: |
          ditto -x -k TmaVGlubine.zip .
          rm TmaVGlubine.zip
          APP=$(ls -d *.app)
          find "$APP" -name '*.dylib' -exec codesign --force --sign - {} \;
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "APP=$APP" >> $GITHUB_ENV
      - name: Самопроверка
        working-directory: build
        run: '"$APP/Contents/MacOS/$(ls "$APP/Contents/MacOS")" --headless -- --selftest'
      - name: Архив
        working-directory: build
        run: |
          ditto -c -k --keepParent "$APP" TmaVGlubine.zip
          rm -rf "$APP"
      - uses: actions/upload-artifact@v4
        with:
          name: game-${{ matrix.key }}
          path: build/
          retention-days: 14
          overwrite: true
