; Пресеты экспорта игры: Steam (Windows, macOS, Linux/Steam Deck). Android — отдельной задачей ко второму релизу.
; Сборки кладутся в build/game/ в корне репозитория (в .gitignore). CI собирает все три (.github/workflows/ci.yml).
; Пресеты «… Demo» — демо для Steam (пролог, game.gd is_demo()): то же самое плюс признак "demo", сборки в build/game/<ос>-demo/.
; В сборку идут история (story/*.json) и данные (data/**/*.json); тесты и инструменты — нет.

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="story/*.json, data/*.json, data/*/*.json"
exclude_filter="tests/*, tools/*, addons/gut/*"
export_path="../build/game/windows/TmaVGlubine.exe"

[preset.0.options]

binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=false
application/product_name="Тьма в глубине"
application/file_description="Where the Sleeper Lies"

[preset.1]

name="macOS"
platform="macOS"
runnable=true
export_filter="all_resources"
include_filter="story/*.json, data/*.json, data/*/*.json"
exclude_filter="tests/*, tools/*, addons/gut/*"
export_path="../build/game/macos/TmaVGlubine.zip"

[preset.1.options]

binary_format/architecture="universal"
application/bundle_identifier="com.patrushev.tmavglubine"
application/short_version="0.1"
application/version="0.1"
application/min_macos_version_arm64="11.00"
codesign/codesign=1
notarization/notarization=0

